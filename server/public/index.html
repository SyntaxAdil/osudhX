<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OsudhX API</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .container {
        width: 90%;
        max-width: 700px;
        padding: 50px;
        text-align: center;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        margin-bottom: 20px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 14px;
        font-weight: 600;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
      }

      h1 {
        font-size: 38px;
        margin-bottom: 12px;
      }

      p {
        color: #64748b;
        line-height: 1.7;
        margin-bottom: 30px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      a {
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 600;
        transition: 0.2s;
      }

      .primary {
        background: #0f172a;
        color: white;
      }

      .secondary {
        border: 1px solid #cbd5e1;
        color: #0f172a;
      }

      a:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }

      .footer {
        margin-top: 30px;
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="status">
        <span class="dot"></span>
        API Operational
      </div>

      <h1>OsudhX</h1>

      <p>
        Smart Pharmacy Management System API. Manage medicines, categories,
        orders, users and pharmacy operations through a secure REST API.
      </p>

      <div class="buttons">
        <a class="primary" href="https://osudhx-server.vercel.app/docs"> API Documentation </a>
      </div>

      <div class="footer">
        OsudhX Backend • Express.js + TypeScript + Prisma + PostgreSQL
      </div>
    </div>
  </body>
</html>
